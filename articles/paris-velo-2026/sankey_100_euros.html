                // Retire height fixe + active autosize
                el.style.height = '';

        });
    }
    // Multiple triggers : dès que Plotly a fini d'initialiser
    var iv = setInterval(function(){
        if (window.Plotly && document.querySelector('.js-plotly-plot')) {
            forceAutosize();
            clearInterval(iv);
        }

    // Backfill : resize à tout moment utile
    [200, 500, 1000, 2000].forEach(function(t){ setTimeout(forceAutosize, t); });

    window.addEventListener('load', forceAutosize);
})();
