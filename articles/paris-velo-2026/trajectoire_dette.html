<!-- tawiza-strong-plotly-fix --><style>
    html, body { margin: 0; padding: 4px; height: 100%; }
    body { font-family: "Inter", system-ui, sans-serif; background: #FDFBF7; }
    /* Force le div Plotly à prendre toute la place dispo */
    .plotly-graph-div, .js-plotly-plot {
        width: 100% !important; height: 100% !important; min-height: 320px !important;
    }
    @media (max-width: 640px) {
        .plotly-graph-div, .js-plotly-plot { min-height: 420px !important; }
        .legend text, text.legendtext { font-size: 10px !important; }
        .gtitle { font-size: 12px !important; }
        .xtick text, .ytick text { font-size: 9px !important; }
    }
</style>
<script>
(function(){
    function forceAutosize(){
        if (!window.Plotly) return;
        document.querySelectorAll('.js-plotly-plot, .plotly-graph-div').forEach(function(el){
            try {
                // Retire height fixe + active autosize
                el.style.height = '';
                Plotly.relayout(el, { autosize: true, height: null, width: null });
                Plotly.Plots.resize(el);
            } catch(e){}
        });
    }
    // Multiple triggers : dès que Plotly a fini d'initialiser
    var iv = setInterval(function(){
        if (window.Plotly && document.querySelector('.js-plotly-plot')) {
            forceAutosize();
            clearInterval(iv);
        }
    }, 100);
    // Backfill : resize à tout moment utile
    [200, 500, 1000, 2000].forEach(function(t){ setTimeout(forceAutosize, t); });
    window.addEventListener('resize', forceAutosize);
    window.addEventListener('load', forceAutosize);
})();
</script>

<!-- tawiza-mobile-declutter --><script>
(function(){
    // Sur mobile : ne garder que les 3 annotations structurantes (début Hidalgo, COVID, CRC)
    // + réduire le "×7" à une taille lisible
    var KEEP_MOBILE = ['Début mandat Hidalgo', 'COVID', 'Rapport CRC'];
    function declutter(){
        if (!window.Plotly) return;
        var isMobile = window.innerWidth <= 640;
        document.querySelectorAll('.js-plotly-plot').forEach(function(el){
            try {
                var layout = el.layout || {};
                var anns = layout.annotations || [];
                if (!isMobile) return; // desktop : pas touché
                var filtered = anns.filter(function(a){
                    if (!a.text) return false;
                    // Garde le "×7" mais réduit sa taille
                    if (a.text.indexOf('×7') >= 0 || a.text.indexOf('x7') >= 0) {
                        if (a.font) a.font.size = 22;
                        return true;
                    }
                    // Garde seulement les 3 annotations structurantes
                    return KEEP_MOBILE.some(function(k){
                        return a.text.indexOf(k) >= 0;
                    });
                }).map(function(a){
                    // Simplifie les annotations restantes : font plus petit, pas de box
                    if (a.font) a.font.size = Math.min(9, a.font.size || 10);
                    return a;
                });
                Plotly.relayout(el, {
                    annotations: filtered,
                    'margin.l': 35,
                    'margin.r': 15,
                    'margin.t': 50,
                    'margin.b': 45,
                });
            } catch(e) { console.warn('declutter fail', e); }
        });
    }
    var iv = setInterval(function(){
        if (window.Plotly && document.querySelector('.js-plotly-plot')) {
            declutter(); clearInterval(iv);
        }
    }, 100);
    [300, 800, 1500].forEach(function(t){ setTimeout(declutter, t); });
    window.addEventListener('resize', declutter);
})();
</script>
