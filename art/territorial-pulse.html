    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px; font-weight: 600; color: var(--anthropic-dark);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button {
            background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px;
            border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease; width: 100%;
        }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container {
            width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white;
        }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 200px 0; }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
    <script defer data-domain="tawiza.fr" src="https://t.tawiza.fr/js/script.js"></script>

<body>
    <div class="container">
        <div class="sidebar">
            <h1>Territorial Pulse</h1>
            <div class="subtitle">Causalite cumulative - micro-signaux territoriaux rendus visibles par leurs trajectoires dans un champ de forces invisible.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="59" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Signaux</label>
                    <div class="slider-container">
                        <input type="range" id="signalCount" min="400" max="4000" step="200" value="1800" oninput="updateParam('signalCount', this.value)">
                        <span class="value-display" id="signalCount-value">1800</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Inertie territoriale</label>
                    <div class="slider-container">
                        <input type="range" id="inertia" min="0.85" max="0.99" step="0.01" value="0.96" oninput="updateParam('inertia', this.value)">
                        <span class="value-display" id="inertia-value">0.96</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.001" max="0.012" step="0.001" value="0.004" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.004</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Force du champ</label>
                    <div class="slider-container">
                        <input type="range" id="fieldStrength" min="0.1" max="1.5" step="0.1" value="0.4" oninput="updateParam('fieldStrength', this.value)">
                        <span class="value-display" id="fieldStrength-value">0.4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Octaves (echelles)</label>
                    <div class="slider-container">
                        <input type="range" id="octaves" min="1" max="5" step="1" value="3" oninput="updateParam('octaves', this.value)">
                        <span class="value-display" id="octaves-value">3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Opacite des traces</label>
                    <div class="slider-container">
                        <input type="range" id="traceAlpha" min="2" max="25" step="1" value="8" oninput="updateParam('traceAlpha', this.value)">
                        <span class="value-display" id="traceAlpha-value">8</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Palette</h3>
                <div class="color-group">
                    <label>Pierre (base)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#a8a29e" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#a8a29e</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Ambre (signal actif)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#b45309" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#b45309</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Alerte (convergence)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#c1554d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#c1554d</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom:8px">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">⬇ PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initialisation des signaux territoriaux...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // PARAMETERS
        // ═══════════════════════════════════════════════════════════════

        let params = {
            seed: 59,
            signalCount: 1800,
            inertia: 0.96,
            turbulence: 0.004,
            fieldStrength: 0.4,
            octaves: 3,
            traceAlpha: 8,
            colors: ['#a8a29e', '#b45309', '#c1554d'],
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        // ═══════════════════════════════════════════════════════════════
        // SIGNAL PARTICLE - a micro-signal flowing through territory
        // ═══════════════════════════════════════════════════════════════

        class Signal {
            constructor(w, h) {
                this.w = w; this.h = h;
                this.x = random(w);
                this.y = random(h);
                this.vx = 0;
                this.vy = 0;
                this.age = 0;
                this.maxAge = floor(random(200, 800));
                this.weight = random(0.3, 1.5);
                // Classification: 0=neutre, 1=actif, 2=alerte
                this.type = random() < 0.65 ? 0 : (random() < 0.7 ? 1 : 2);
            }

            update(field, w, h) {
                // Sample flow field at position
                let col = constrain(floor(this.x / 10), 0, floor(w / 10) - 1);
                let row = constrain(floor(this.y / 10), 0, floor(h / 10) - 1);
                let idx = col + row * floor(w / 10);

                if (field[idx]) {
                    let angle = field[idx];
                    let force = params.fieldStrength;

                    // Velocity with inertia (territoire = systeme avec memoire)
                    this.vx = this.vx * params.inertia + cos(angle) * force * (1 - params.inertia);
                    this.vy = this.vy * params.inertia + sin(angle) * force * (1 - params.inertia);
                }

                this.x += this.vx;
                this.y += this.vy;
                this.age++;

                // Wrap around (territoire continu)
                if (this.x < 0) this.x += w;
                if (this.x > w) this.x -= w;
                if (this.y < 0) this.y += h;
                if (this.y > h) this.y -= h;

                // Respawn when aged out
                if (this.age > this.maxAge) {
                    this.x = random(w);
                    this.y = random(h);
                    this.vx = 0;
                    this.vy = 0;
                    this.age = 0;
                    this.maxAge = floor(random(200, 800));
                }
            }

            display(gfx, cols) {
                let speed = sqrt(this.vx * this.vx + this.vy * this.vy);
                let life = 1 - this.age / this.maxAge;

                // Fade in/out lifecycle
                let fade = life < 0.1 ? life * 10 : (life > 0.85 ? (1 - life) * 6.67 : 1);
                let alpha = params.traceAlpha * fade * this.weight;

                // Color by type and speed
                let c;
                if (this.type === 0) {
                    c = cols[0]; // pierre - neutre
                } else if (this.type === 1) {
                    // actif: lerp pierre → ambre based on speed
                    let t = constrain(speed * 2.5, 0, 1);
                    c = lerpColor(cols[0], cols[1], t);
                } else {
                    // alerte: lerp ambre → rouge based on speed
                    let t = constrain(speed * 3, 0, 1);
                    c = lerpColor(cols[1], cols[2], t);
                }

                gfx.stroke(red(c), green(c), blue(c), alpha);
                gfx.strokeWeight(this.weight * (0.5 + speed * 0.8));
                gfx.point(this.x, this.y);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // FLOW FIELD - multi-octave Perlin noise (macro/meso/micro)
        // ═══════════════════════════════════════════════════════════════

        let signals = [];
        let flowField = [];
        let fieldCols, fieldRows;
        let parsedColors = [];
        let t = 0; // Time for slow field evolution

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            document.querySelector('.loading').style.display = 'none';
            pixelDensity(1);
            initializeSystem();
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            t = 0;

            // Parse colors
            parsedColors = params.colors.map(c => color(c));

            fieldCols = floor(width / 10);
            fieldRows = floor(height / 10);
            flowField = new Array(fieldCols * fieldRows);

            // Create signals
            signals = [];
            for (let i = 0; i < params.signalCount; i++) {
                signals.push(new Signal(width, height));
            }

            generateField();
            background(250, 249, 245);
        }

        function generateField() {
            let oct = params.octaves;
            let scale = params.turbulence;

            for (let y = 0; y < fieldRows; y++) {
                for (let x = 0; x < fieldCols; x++) {
                    let angle = 0;
                    let amp = 1;
                    let freq = scale;
                    let total = 0;

                    // Multi-octave: macro (national) + meso (regional) + micro (local)
                    for (let o = 0; o < oct; o++) {
                        angle += noise(x * freq + t * 0.003, y * freq + t * 0.002, params.seed * 0.01) * TWO_PI * 2 * amp;
                        total += amp;
                        amp *= 0.5;
                        freq *= 2.2;
                    }
                    angle /= total;

                    flowField[x + y * fieldCols] = angle;
                }
            }
        }

        function draw() {
            // Very slow field evolution - territories change slowly
            t += 0.15;
            if (frameCount % 8 === 0) {
                generateField();
            }

            // Draw signals
            for (let s of signals) {
                s.update(flowField, width, height);
                s.display(this, parsedColors);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // UI HANDLERS
        // ═══════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            let v = parseFloat(value);
            params[name] = v;
            document.getElementById(name + '-value').textContent = v;
            if (name === 'signalCount') {
                // Adjust particle count without full reset
                while (signals.length < v) signals.push(new Signal(width, height));
                while (signals.length > v) signals.pop();
            }
        }

        function updateColor(id, value) {
            let idx = parseInt(id.replace('color', '')) - 1;
            params.colors[idx] = value;
            parsedColors[idx] = color(value);
            document.getElementById(id + '-value').textContent = value;
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let s = parseInt(input.value);
            if (s && s > 0) { params.seed = s; initializeSystem(); }
            else updateSeedDisplay();
        }

        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed++; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            parsedColors = params.colors.map(c => color(c));
            document.getElementById('signalCount').value = params.signalCount;
            document.getElementById('signalCount-value').textContent = params.signalCount;
            document.getElementById('inertia').value = params.inertia;
            document.getElementById('inertia-value').textContent = params.inertia;
            document.getElementById('turbulence').value = params.turbulence;
            document.getElementById('turbulence-value').textContent = params.turbulence;
            document.getElementById('fieldStrength').value = params.fieldStrength;
            document.getElementById('fieldStrength-value').textContent = params.fieldStrength;
            document.getElementById('octaves').value = params.octaves;
            document.getElementById('octaves-value').textContent = params.octaves;
            document.getElementById('traceAlpha').value = params.traceAlpha;
            document.getElementById('traceAlpha-value').textContent = params.traceAlpha;
            document.getElementById('color1').value = params.colors[0];
            document.getElementById('color1-value').textContent = params.colors[0];
            document.getElementById('color2').value = params.colors[1];
            document.getElementById('color2-value').textContent = params.colors[1];
            document.getElementById('color3').value = params.colors[2];
            document.getElementById('color3-value').textContent = params.colors[2];
            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('territorial-pulse-' + params.seed, 'png');
        }

        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
