<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>panoptic - un regard sur l'agrivoltaïsme français</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="panoptic - on croise les registres publics sur l'agrivoltaïsme. On revient bientôt.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:title" content="panoptic - un regard sur l'agrivoltaïsme français">
<meta property="og:description" content="on croise 4 registres publics. on revient bientôt.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://panoptic.tawiza.fr">

<style>
  :root {
    --bg:       #b45309;   /* ocre - mascotte */
    --ink:      #1a1612;
    --ink-soft: #3a342c;
    --cream:    #faf5ef;
    --serif:    "Instrument Serif", Georgia, "Iowan Old Style", ui-serif, serif;
    --mono:     "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* ---- Hachures subtiles en coin bas-droit (signature Tawiza) ---- */
  .hatch {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 260px;
    height: 420px;
    opacity: 0.18;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      45deg,
      var(--ink) 0 1.5px,
      transparent 1.5px 8px
    );
    z-index: 0;
  }

  /* ---- Layout principal ---- */
  .wrap {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 48px clamp(24px, 6vw, 96px);
    z-index: 1;
  }

  /* ---- Top bar : kicker + status blink ---- */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .top .kicker { text-transform: none; }
  .top .status { display: flex; align-items: center; gap: 8px; }

  /* ---- Surlignage crème façon stabilo ---- */
  /* Gradient monte à 15% pour couvrir 85% de la hauteur de ligne :
     le corps des lettres repose sur le crème, seuls les ascendants
     dépassent dans l'ocre. Texte en ink pur (pas ink-soft) pour
     garder un contraste fort sur petite typo mono. */
  .mark {
    background: linear-gradient(
      transparent 12%,
      rgba(250, 245, 239, 0.96) 12%,
      rgba(250, 245, 239, 0.96) 94%,
      transparent 94%
    );
    padding: 0 0.35em;
    color: var(--ink);
    font-weight: 500;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mark:hover,
  a.mark:hover {
    background: rgba(250, 245, 239, 1);
    color: var(--ocre);
  }
  a.mark {
    text-decoration: none;
    cursor: pointer;
  }
  .top .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cream);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  /* ---- Œil géant, centré ---- */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(32px, 5vh, 72px);
    padding: clamp(24px, 5vh, 48px) 0;
  }
  .eye-root {
    width: min(90vw, 720px);
    height: auto;
    aspect-ratio: 40 / 16;
    color: var(--ink);
    --eye-sclera:     #faf5ef;
    --eye-iris:       #1a1612;
    --eye-iris-inner: #3a342c;
    --eye-pupil:      #b45309;
    --eye-highlight:  #faf5ef;
    --pupil-x: 0px;
    --pupil-y: 0px;
    cursor: crosshair;
    transition: filter 0.2s ease;
  }
  .eye-root:hover { filter: drop-shadow(0 0 24px rgba(26,22,18,0.25)); }
  .eye-root svg { width: 100%; height: 100%; display: block; }
  .eye-root .eye-pupil {
    transform: translate(var(--pupil-x), var(--pupil-y));
    transform-origin: 20px 8px;
    transition: transform 0.08s linear;
  }

  /* ---- Terminal-style caption ---- */
  .caption {
    font-family: var(--mono);
    font-size: clamp(13px, 1.6vw, 18px);
    line-height: 1.9;
    color: var(--ink);
    background: rgba(250, 245, 239, 0.92);
    border: 1px solid var(--ink);
    border-radius: 4px;
    padding: 24px 28px;
    max-width: 640px;
    width: calc(100% - 48px);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .caption .line { display: block; white-space: pre-wrap; }
  .caption .line.muted { color: var(--ink-soft); }
  .caption .line.err   { color: #8B0000; }
  .caption .prompt { color: var(--ink-soft); user-select: none; }
  .caption .cursor {
    display: inline-block;
    width: 9px;
    height: 1.05em;
    background: var(--ink);
    vertical-align: -0.15em;
    margin-left: 3px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* ---- Footer ---- */
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px 32px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    padding-top: 24px;
    border-top: 1px solid rgba(26,22,18,0.2);
  }
  .foot a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .foot a:hover { color: var(--ink); }

  /* ---- Easter egg : clic sur l'œil ---- */
  .eye-root.winked { animation: shake 0.4s ease-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    .top .status .dot,
    .caption .cursor { animation: none; }
  }
</style>
</head>
<body>
<div class="hatch" aria-hidden="true"></div>

<div class="wrap">

  <div class="top">
    <span class="kicker"><span class="mark">// panoptic - un regard</span></span>
    <span class="status">
      <span class="dot"></span>
      <span class="mark">work_in_progress</span>
    </span>
  </div>

  <main class="stage">
    <div class="eye-root" role="img" aria-label="3AYNE - l'œil de panoptic">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 16" shape-rendering="crispEdges" class="eye-svg">
        <g class="eye-lashes-top" fill="currentColor">
          <rect x="8"  y="0" width="1" height="2"/><rect x="14" y="0" width="1" height="2"/>
          <rect x="20" y="0" width="1" height="2"/><rect x="26" y="0" width="1" height="2"/>
          <rect x="32" y="0" width="1" height="2"/>
        </g>
        <g class="eye-lid-top" fill="currentColor">
          <rect x="6"  y="3" width="1" height="1"/><rect x="7"  y="2" width="2" height="1"/>
          <rect x="9"  y="2" width="4" height="1"/><rect x="13" y="2" width="4" height="1"/>
          <rect x="17" y="2" width="6" height="1"/><rect x="23" y="2" width="4" height="1"/>
          <rect x="27" y="2" width="4" height="1"/><rect x="31" y="2" width="2" height="1"/>
          <rect x="33" y="3" width="1" height="1"/>
        </g>
        <g class="eye-sclera" fill="var(--eye-sclera)">
          <rect x="8"  y="4"  width="24" height="8"/>
          <rect x="9"  y="3"  width="22" height="1"/>
          <rect x="9"  y="12" width="22" height="1"/>
          <rect x="11" y="13" width="18" height="1"/>
        </g>
        <g class="eye-iris" fill="var(--eye-iris)">
          <rect x="15" y="4"  width="10" height="1"/><rect x="14" y="5"  width="12" height="1"/>
          <rect x="13" y="6"  width="14" height="1"/><rect x="13" y="7"  width="14" height="1"/>
          <rect x="13" y="8"  width="14" height="1"/><rect x="13" y="9"  width="14" height="1"/>
          <rect x="14" y="10" width="12" height="1"/><rect x="15" y="11" width="10" height="1"/>
        </g>
        <g class="eye-iris-inner" fill="var(--eye-iris-inner)">
          <rect x="16" y="5"  width="8" height="1"/><rect x="15" y="6"  width="10" height="1"/>
          <rect x="15" y="7"  width="10" height="1"/><rect x="15" y="8"  width="10" height="1"/>
          <rect x="15" y="9"  width="10" height="1"/><rect x="16" y="10" width="8" height="1"/>
        </g>
        <g class="eye-pupil" fill="var(--eye-pupil)">
          <rect x="18" y="6" width="4" height="4"/>
          <rect x="18" y="6" width="1" height="1" fill="var(--eye-highlight)"/>
          <rect x="19" y="6" width="1" height="1" fill="var(--eye-highlight)" opacity="0.55"/>
        </g>
        <g class="eye-lid-bottom" fill="currentColor">
          <rect x="8"  y="13" width="2" height="1"/>
          <rect x="10" y="14" width="20" height="1"/>
          <rect x="30" y="13" width="2" height="1"/>
        </g>
        <!-- Paupière de clignement : rect noir qui descend depuis le haut -->
        <rect class="blink-top" x="6" y="2" width="28" height="0" fill="currentColor"/>
      </svg>
    </div>

    <div class="caption" aria-live="polite">
      <span class="line muted">$ panoptic --status</span>
      <span class="line">&gt; croisement de 4 registres publics…</span>
      <span class="line muted">&gt; ADEME · projets-environnement · MRAe · CNPrV</span>
      <span class="line">&gt; <strong>la personne est longue.</strong></span>
      <span class="line muted">&gt; désolé - on revient bientôt.</span>
      <span class="line">
        <span class="prompt">$</span>
        <span class="cursor" aria-hidden="true"></span>
      </span>
    </div>
  </main>

  <footer class="foot">
    <span>tawiza - panoptic · <span id="count">626</span> projets croisés</span>
    <span>
      <a class="mark" href="mailto:tawiza.v0@gmail.com">tawiza.v0@gmail.com</a>
      &nbsp;·&nbsp;
      <a class="mark" href="https://tawiza.fr">tawiza.fr</a>
    </span>
  </footer>
</div>

<script>
(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const eye   = document.querySelector('.eye-root');
  if (!eye) return;
  const svg   = eye.querySelector('.eye-svg');
  const pupil = eye.querySelector('.eye-pupil');
  const blink = eye.querySelector('.blink-top');

  // --- Pupille suit curseur (amplitude en unités viewBox) ---
  // viewBox 40×16. Iris utile x=13→27 (14u), y=4→12 (8u). Pupille 4u×4u centrée en (20,8).
  // Amplitude safe : ±2.5u horizontal, ±1.5u vertical pour rester dans l'iris.
  const MAX_X = 2.5, MAX_Y = 1.5;
  function track(x, y) {
    const rect = svg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const nx = Math.max(-1, Math.min(1, (x - cx) / 500));
    const ny = Math.max(-1, Math.min(1, (y - cy) / 400));
    // Les unités CSS sur un transform SVG = unités viewBox, pas pixels écran.
    eye.style.setProperty('--pupil-x', (nx * MAX_X) + 'px');
    eye.style.setProperty('--pupil-y', (ny * MAX_Y) + 'px');
  }

  if (!reduced) {
    window.addEventListener('pointermove', e => track(e.clientX, e.clientY), { passive: true });
    window.addEventListener('touchmove', e => {
      if (e.touches[0]) track(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
  }

  // --- Clignement aléatoire toutes les 6-14s ---
  function doBlink(doubled = false) {
    if (!blink || reduced) return;
    const start = performance.now();
    const dur = 180;
    function frame(t) {
      const p = (t - start) / dur;
      if (p < 0.5) {
        blink.setAttribute('height', (10 * (p * 2)).toFixed(2));
      } else if (p < 1) {
        blink.setAttribute('height', (10 * (1 - (p - 0.5) * 2)).toFixed(2));
      } else {
        blink.setAttribute('height', '0');
        if (doubled) setTimeout(() => doBlink(false), 140);
        return;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function schedule() {
    const delay = 6000 + Math.random() * 8000;
    setTimeout(() => { doBlink(false); schedule(); }, delay);
  }
  if (!reduced) schedule();

  // --- Clic sur l'œil = double wink + petit shake ---
  eye.addEventListener('click', () => {
    doBlink(true);
    eye.classList.add('winked');
    setTimeout(() => eye.classList.remove('winked'), 400);
  });

  // --- Easter egg clavier : Konami → les yeux roulent ---
  const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let idx = 0;
  window.addEventListener('keydown', e => {
    if (e.key === konami[idx]) {
      idx++;
      if (idx === konami.length) {
        idx = 0;
        let t0 = performance.now();
        const roll = (t) => {
          const p = (t - t0) / 1200;
          if (p >= 1) {
            eye.style.setProperty('--pupil-x', '0px');
            eye.style.setProperty('--pupil-y', '0px');
            return;
          }
          const a = p * Math.PI * 4; // 2 tours
          eye.style.setProperty('--pupil-x', (Math.cos(a) * MAX_X) + 'px');
          eye.style.setProperty('--pupil-y', (Math.sin(a) * MAX_Y) + 'px');
          requestAnimationFrame(roll);
        };
        requestAnimationFrame(roll);
      }
    } else {
      idx = 0;
    }
  });
})();
</script>
</body>
</html>
