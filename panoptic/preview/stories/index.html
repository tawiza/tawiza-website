<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>panoptic stories · IG 1080×1920</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #1a1612;
    color: #faf5ef;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    padding: 40px 24px 80px;
    margin: 0;
  }
  h1 {
    color: #D4A843;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  p.intro {
    color: rgba(250,245,239,0.6);
    max-width: 720px;
    margin: 0 auto 40px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.06em;
    line-height: 1.6;
  }
  .row { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .cell {
    position: relative;
    width: 300px;
    flex: 0 0 300px;
  }
  .frame {
    width: 300px;
    height: 533px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(250,245,239,0.15);
    border-radius: 18px;
  }
  .frame iframe {
    width: 1080px;
    height: 1920px;
    transform: scale(0.2778);
    transform-origin: 0 0;
    border: 0;
  }
  .caption {
    font-size: 11px;
    color: rgba(250,245,239,0.55);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
  }
  .caption a { color: #D4A843; text-decoration: none; }
  .caption a:hover { text-decoration: underline; }
  header.top {
    max-width: 720px;
    margin: 0 auto 30px;
    text-align: center;
  }
</style>
</head>
<body>

<header class="top">
  <h1>panoptic · preview stories IG</h1>
  <p class="intro">
    3 cartes 1080×1920, rendu à l'échelle pour validation.<br>
    export PNG : ouvre chaque carte en plein écran et screenshot, ou utilise Playwright/puppeteer.
  </p>
</header>

<div class="row">
  <div class="cell">
    <div class="frame"><iframe src="story-1.html" loading="lazy"></iframe></div>
    <div class="caption">
      <span>1 / 3 · hook</span>
      <a href="story-1.html" target="_blank">voir 1:1</a>
    </div>
  </div>
  <div class="cell">
    <div class="frame"><iframe src="story-2.html" loading="lazy"></iframe></div>
    <div class="caption">
      <span>2 / 3 · 50,5 %</span>
      <a href="story-2.html" target="_blank">voir 1:1</a>
    </div>
  </div>
  <div class="cell">
    <div class="frame"><iframe src="story-3.html" loading="lazy"></iframe></div>
    <div class="caption">
      <span>3 / 3 · CTA</span>
      <a href="story-3.html" target="_blank">voir 1:1</a>
    </div>
  </div>
</div>

</body>
</html>
