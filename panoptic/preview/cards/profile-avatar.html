<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panoptic / Tawiza - Avatar Instagram</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../assets/panoptic-styles.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .avatar {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: var(--bg);       /* crème minéral Tawiza */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Hachures ocre discrètes en coin haut-droit - même signature que les cartes */
  .avatar__hatch {
    position: absolute;
    top: 0;
    right: 0;
    width: 300px;
    height: 520px;
    opacity: 0.55;
    z-index: 0;
  }

  /* Œil 3AYNE géant, centré, qui prend l'espace */
  .avatar__eye {
    position: relative;
    width: 900px;        /* plus grand - il remplit la zone IG ronde */
    height: 360px;
    color: var(--ink);
    z-index: 2;
    --eye-sclera:     #faf5ef;   /* sclera blanche crème (plus claire que le fond) */
    --eye-iris:       #b45309;
    --eye-iris-inner: #C1554D;
    --eye-pupil:      #1a1612;
    --eye-highlight:  #faf5ef;
    --pupil-x:        0px;
    --pupil-y:        0px;
  }

  /* Fond crème-foncé derrière l'œil pour contraster avec la sclera crème-claire */
  .avatar__eye::before {
    content: "";
    position: absolute;
    inset: -40px -60px;
    background: var(--bg-deep);
    border-radius: 24px;
    z-index: -1;
  }

  .avatar__eye svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .avatar__eye svg .eye-pupil {
    transform: translate(var(--pupil-x), var(--pupil-y));
    transform-origin: 20px 8px;
  }
</style>
</head>
<body>
<div class="avatar">
  <div class="avatar__hatch hatch-ocre" aria-hidden="true"></div>
  <div class="avatar__eye">
    <?xml version="1.0" encoding="utf-8"?>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 16" shape-rendering="crispEdges" class="eye-svg">
      <g class="eye-lashes-top" fill="currentColor">
        <rect x="8"  y="0" width="1" height="2"/><rect x="14" y="0" width="1" height="2"/>
        <rect x="20" y="0" width="1" height="2"/><rect x="26" y="0" width="1" height="2"/>
        <rect x="32" y="0" width="1" height="2"/>
      </g>
      <g class="eye-lid-top" fill="currentColor">
        <rect x="6"  y="3" width="1" height="1"/><rect x="7"  y="2" width="2" height="1"/>
        <rect x="9"  y="2" width="4" height="1"/><rect x="13" y="2" width="4" height="1"/>
        <rect x="17" y="2" width="6" height="1"/><rect x="23" y="2" width="4" height="1"/>
        <rect x="27" y="2" width="4" height="1"/><rect x="31" y="2" width="2" height="1"/>
        <rect x="33" y="3" width="1" height="1"/>
      </g>
      <g class="eye-sclera" fill="var(--eye-sclera, #faf5ef)">
        <rect x="8"  y="4" width="24" height="8"/>
        <rect x="9"  y="3" width="22" height="1"/>
        <rect x="9"  y="12" width="22" height="1"/>
        <rect x="11" y="13" width="18" height="1"/>
      </g>
      <g class="eye-iris" fill="var(--eye-iris, #b45309)">
        <rect x="15" y="4"  width="10" height="1"/><rect x="14" y="5"  width="12" height="1"/>
        <rect x="13" y="6"  width="14" height="1"/><rect x="13" y="7"  width="14" height="1"/>
        <rect x="13" y="8"  width="14" height="1"/><rect x="13" y="9"  width="14" height="1"/>
        <rect x="14" y="10" width="12" height="1"/><rect x="15" y="11" width="10" height="1"/>
      </g>
      <g class="eye-iris-inner" fill="var(--eye-iris-inner, #C1554D)">
        <rect x="16" y="5"  width="8" height="1"/><rect x="15" y="6"  width="10" height="1"/>
        <rect x="15" y="7"  width="10" height="1"/><rect x="15" y="8"  width="10" height="1"/>
        <rect x="15" y="9"  width="10" height="1"/><rect x="16" y="10" width="8" height="1"/>
      </g>
      <g class="eye-pupil" fill="var(--eye-pupil, #1a1612)">
        <rect x="18" y="6" width="4" height="4"/>
        <rect x="18" y="6" width="1" height="1" fill="var(--eye-highlight, #faf5ef)"/>
      </g>
      <g class="eye-lid-bottom" fill="currentColor">
        <rect x="8"  y="13" width="2" height="1"/>
        <rect x="10" y="14" width="20" height="1"/>
        <rect x="30" y="13" width="2" height="1"/>
      </g>
    </svg>
  </div>
</div>
</body>
</html>
