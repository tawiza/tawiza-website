<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panoptic - Carte 1/8 · hook</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="../assets/panoptic-styles.css">
<style>
  /* Carte 1 - hook : chiffre-héros +600 + glyph hachuré ocre */
  .card-1 .card__hero--number {
    color: var(--ink);
    font-size: 380px;            /* réduit de 420 pour accueillir "+600" sans déborder */
    line-height: 0.85;
  }
  .card-1 .glyph-hatch {
    width: 240px;                /* réduit de 300 - laisse respirer le chiffre */
    height: 420px;
    top: 0;
    right: 0;
    opacity: 0.85;
  }
</style>
</head>
<body>
<article class="card card-1">
  <div class="eye-watcher" role="img" aria-label="3AYNE - le regard panoptic">
<?xml version="1.0" encoding="utf-8"?>
<!-- 3AYNE - l'œil Tawiza pixel-art CSS-playable
     viewBox 40x16, 1 unité = 1 pixel, pupille contrôlable via CSS custom properties -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 40 16"
     shape-rendering="crispEdges"
     role="img"
     aria-label="3AYNE - l'œil qui regarde Tawiza"
     class="eye-svg">
  <title>3AYNE</title>

  <!-- Cils supérieurs (petits ticks) -->
  <g class="eye-lashes-top" fill="currentColor">
    <rect x="8"  y="0" width="1" height="2"/>
    <rect x="14" y="0" width="1" height="2"/>
    <rect x="20" y="0" width="1" height="2"/>
    <rect x="26" y="0" width="1" height="2"/>
    <rect x="32" y="0" width="1" height="2"/>
  </g>

  <!-- Paupière supérieure (trait épais) -->
  <g class="eye-lid-top" fill="currentColor">
    <rect x="6"  y="3" width="1" height="1"/>
    <rect x="7"  y="2" width="2" height="1"/>
    <rect x="9"  y="2" width="4" height="1"/>
    <rect x="13" y="2" width="4" height="1"/>
    <rect x="17" y="2" width="6" height="1"/>
    <rect x="23" y="2" width="4" height="1"/>
    <rect x="27" y="2" width="4" height="1"/>
    <rect x="31" y="2" width="2" height="1"/>
    <rect x="33" y="3" width="1" height="1"/>
  </g>

  <!-- Sclera (le blanc de l'œil, en cream) -->
  <g class="eye-sclera" fill="var(--eye-sclera, #f3ebdd)">
    <rect x="8"  y="4" width="24" height="8"/>
    <rect x="9"  y="3" width="22" height="1"/>
    <rect x="9"  y="12" width="22" height="1"/>
    <rect x="11" y="13" width="18" height="1"/>
  </g>

  <!-- Iris ring - anneau extérieur ocre -->
  <g class="eye-iris" fill="var(--eye-iris, #b45309)">
    <rect x="15" y="4"  width="10" height="1"/>
    <rect x="14" y="5"  width="12" height="1"/>
    <rect x="13" y="6"  width="14" height="1"/>
    <rect x="13" y="7"  width="14" height="1"/>
    <rect x="13" y="8"  width="14" height="1"/>
    <rect x="13" y="9"  width="14" height="1"/>
    <rect x="14" y="10" width="12" height="1"/>
    <rect x="15" y="11" width="10" height="1"/>
  </g>

  <!-- Iris inner ring - rouge terre -->
  <g class="eye-iris-inner" fill="var(--eye-iris-inner, #C1554D)">
    <rect x="16" y="5"  width="8" height="1"/>
    <rect x="15" y="6"  width="10" height="1"/>
    <rect x="15" y="7"  width="10" height="1"/>
    <rect x="15" y="8"  width="10" height="1"/>
    <rect x="15" y="9"  width="10" height="1"/>
    <rect x="16" y="10" width="8" height="1"/>
  </g>

  <!-- Pupille (carré central, déplaçable via transform) -->
  <g class="eye-pupil"
     fill="var(--eye-pupil, #1a1612)"
     style="transform: translate(var(--pupil-x, 0px), var(--pupil-y, 0px));
            transform-origin: 20px 8px;
            transition: transform 0.18s cubic-bezier(.22,.9,.35,1);">
    <rect x="18" y="6" width="4" height="4"/>
    <!-- Highlight (un pixel cream en haut-gauche) -->
    <rect x="18" y="6" width="1" height="1" fill="var(--eye-highlight, #faf5ef)"/>
  </g>

  <!-- Paupière inférieure (trait fin) -->
  <g class="eye-lid-bottom" fill="currentColor">
    <rect x="8"  y="13" width="2" height="1"/>
    <rect x="10" y="14" width="20" height="1"/>
    <rect x="30" y="13" width="2" height="1"/>
  </g>

  <!-- Paupière de clignement - rectangle cream qui descend -->
  <g class="eye-blinker" fill="var(--eye-sclera, #f3ebdd)">
    <rect class="blink-top" x="8" y="3" width="24" height="0"/>
  </g>
</svg>

</div>
<div class="glyph-hatch hatch-ocre" aria-hidden="true"></div>

  <header>
    <p class="card__kicker">// panoptic - carte 1/8</p>
  </header>

  <section class="card__main">
    <h1 class="card__hero card__hero--number">+600</h1>
    <div class="card__rule"></div>
    <p class="card__sub">
      projets agrivoltaïques croisés dans <strong>3 registres officiels</strong> + la carte des contestations CNPrV. Aucune source seule ne voit le pipeline complet. On a essayé de les rassembler.
    </p>
  </section>

  <footer class="card__footer">
    <p class="card__source">ADEME · projets-environnement.gouv.fr · MRAe · CNPrV (extraction 2026-04)</p>
    <p class="card__wordmark">tawiza - panoptic</p>
  </footer>
</article>
</body>
</html>
